<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auto Dark Theme</title>

<link rel="stylesheet" href="popup.css">

</head>

<body>

<div id="container">

    <h2>🌙 Auto Dark Theme</h2>

    <div class="section">

        <label class="switch">

            <input type="checkbox" id="enabled">

            <span class="slider"></span>

        </label>

        <span class="label">
            Enable Extension
        </span>

    </div>

    <div class="section">

        <label class="switch">

            <input type="checkbox" id="autoDetect">

            <span class="slider"></span>

        </label>

        <span class="label">
            Auto Detect Dark Sites
        </span>

    </div>

    <hr>

    <div class="section">

        <label>

            Brightness Threshold

        </label>

        <input
            id="threshold"
            type="range"
            min="50"
            max="255"
            value="180">

        <div id="thresholdValue">

            180

        </div>

    </div>

    <hr>

    <button id="toggleSite">

        Disable on this Site

    </button>

    <button id="refresh">

        Reapply Dark Theme

    </button>

    <hr>

    <div id="status">

        Ready

    </div>

</div>

<script src="popup.js"></script>

</body>

</html>
